<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Configurar Alineación de la Jornada</title>
    <script th:src="@{/js/admin.js}" defer></script>
    
    <link rel="stylesheet" th:href="@{/css/estilos-jornadas.css}">
    <link rel="stylesheet" th:href="@{/css/estilos-admin.css}">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
    <link rel="stylesheet" th:href="@{/css/estilos-tops.css}">
    <link rel="stylesheet" th:href="@{/css/estilos-records.css}">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="shortcut icon" th:href="@{/favicon.png}" type="image/x-icon">
</head>
<body>

    <nav th:replace="~{admin/admin-navbar :: nav}"></nav>

    <div class="pitch-container">

        <div class="contador-puntos-flotante" id="badgePuntosTotalesContainer">
            <span class="contador-puntos-titulo">Total Pts</span>
            <span class="contador-puntos-valor" id="totalPuntosJornada">0</span>
        </div>

        <h2 style="color: white; text-align: center; margin-top: 0; display: flex; justify-content: center; align-items: center; gap: 0.5rem; flex-wrap: wrap;">
            Alineación - Jornada 
            <select id="selectJornada" 
                    onchange="cargarAlineacionEquipo()" 
                    style="padding: 0.2rem; border-radius: 0.375rem; font-size: 1.25rem; font-weight: bold; color: black;">
                <option th:each="i : ${#numbers.sequence(1, 38)}" 
                        th:value="${i}" 
                        th:text="${i}" 
                        th:selected="${i == (jornadaActual ?: 1)}">
                </option>
            </select>
        </h2>
        <!-- Selector de Equipo/Míster y Formación Táctica -->
        <div class="tactic-selector-container">
            <div style="display: flex; align-items: center; gap: 0.5rem;">
                <label for="selectEquipo"><strong>Equipo:</strong></label>
                <img id="imgEquipo" class="club-logo-preview empty" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23ccc'><path d='M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5'/></svg>" alt="Logo Club" style="width: 2.2rem; height: 2.2rem; object-fit: contain; border-radius: 50%; background-color: #ffffff; border: 1px solid #cccccc; padding: 2px;">
                <select id="selectEquipo" 
                        th:data-url="@{/mantenimiento/admin/listaEquipos}" 
                        onchange="actualizarLogo('selectEquipo', 'imgEquipo'); cargarAlineacionEquipo();" 
                        style="padding: 0.375rem 0.5rem; border-radius: 0.375rem; border: 1px solid #ccc; font-weight: bold; max-width: 160px;">
                    <option value="">Cargando equipos...</option>
                </select>
            </div>

            <div style="display: flex; align-items: center; gap: 0.5rem;">
                <label for="selectEsquema"><strong>Formación:</strong></label>
                <select id="selectEsquema" onchange="cambiarEsquemaTactico(this.value)">
                    <option value="4-3-3" selected>4-3-3</option>
                    <option value="4-4-2">4-4-2</option>
                    <option value="4-5-1">4-5-1</option>
                    <option value="3-4-3">3-4-3</option>
                    <option value="3-5-2">3-5-2</option>
                    <option value="5-3-2">5-3-2</option>
                    <option value="5-4-1">5-4-1</option>
                </select>
            </div>
        </div>

        <!-- Terreno de Juego -->
        <div id="campoFutbol">
            <div class="pitch-row" id="lineaDL"></div>
            <div class="pitch-row" id="lineaMC"></div>
            <div class="pitch-row" id="lineaDF"></div>
            <div class="pitch-row" id="lineaPT"></div>
        </div>

        <!-- Botón para Guardar -->
        <div style="margin-top: 20px; text-align: center;">
            <button onclick="guardarAlineacion()" class="btn-guardar-alineacion">
                💾 Guardar Alineación
            </button>
        </div>
    </div>

    <!-- Modal de Estadísticas del Jugador -->
    <!-- Modal de Estadísticas del Jugador -->
    <div class="modal" id="modalJugador">
        <div class="modal-content-jugador">
            
            <!-- CABECERA: Título a la izquierda y Control de Capitán a la derecha -->
            <div style="display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; margin-bottom: 0.8rem;">
                <h3 id="modalTitulo" style="margin: 0; white-space: nowrap;">Estadísticas del Jugador</h3>
                
                <!-- Control Integrado de Capitán -->
                <div style="display: flex; align-items: center; gap: 0.35rem; background: #f8fafc; padding: 0.25rem 0.5rem; border-radius: 6px; border: 1px solid #e2e8f0;">
                    <label style="font-size: 0.85rem; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 0.2rem; margin: 0; white-space: nowrap;">
                        <input type="checkbox" id="checkCapitan" onchange="toggleMultiplicadorCapitan()" style="cursor: pointer;"> 👑
                    </label>
                    <select id="selectMultiplicadorCapitan" disabled style="padding: 0.15rem 0.3rem; border-radius: 4px; border: 1px solid #ccc; font-weight: bold; font-size: 0.8rem; background: #fff;">
                        <option value="1.5">x1.5</option>
                        <option value="2">x2</option>
                        <option value="3">x3</option>
                    </select>
                </div>
            </div>
            
            <div class="stat-input">
                <label for="inputNombre">Nombre del Jugador:</label>
                <div style="display: flex; align-items: center; gap: 8px;">
                    <!-- Escudo del equipo real -->
                    <img id="imgEscudoEquipoReal" src="" alt="" style="width: 24px; height: 24px; object-fit: contain; display: none;" />
                    
                    <input type="text" id="inputNombre" list="listaSugerenciasJugadores" placeholder="Ej. L.Yamal" autocomplete="off" style="flex: 1;">
                </div>
                
                <datalist id="listaSugerenciasJugadores"></datalist>
                <input type="hidden" id="inputJugadorId">
                <input type="hidden" id="inputJugadorRealId">
            </div>

            <div class="stat-input" style="margin-top: 10px;">
                <label for="inputPuntos" style="color: #2e7d32;">💯 Puntos en la Jornada:</label>
                <input type="number" id="inputPuntos" value="0" class="input-puntos-destacado">
            </div>

            <!-- Checks de Estado -->
            <div class="checkbox-group">
                <label class="checkbox-item">
                    <input type="checkbox" id="checkPartidoJugado" checked> Jugó 🏃
                </label>
                <label class="checkbox-item">
                    <input type="checkbox" id="checkXiIdeal"> XI Ideal ⭐ 
                </label>
                <label class="checkbox-item">
                    <input type="checkbox" id="pendiente"> Pendiente ⏳
                </label>
            </div>

            <!-- Inputs Numéricos de Estadísticas -->
            <div class="stat-group">
                <div class="stat-input">
                    <label for="inputGoles">⚽ Goles</label>
                    <input type="number" id="inputGoles" value="0" min="0">
                </div>
                <div class="stat-input">
                    <label for="inputAsistencias">👟 Asistencias</label>
                    <input type="number" id="inputAsistencias" value="0" min="0">
                </div>
                <div class="stat-input">
                    <label for="inputAmarillas">🟨 Amarillas</label>
                    <input type="number" id="inputAmarillas" value="0" min="0" max="2">
                </div>
                <div class="stat-input">
                    <label for="inputRojas">🟥 Rojas</label>
                    <input type="number" id="inputRojas" value="0" min="0" max="1">
                </div>
                <div class="stat-input stat-full-width" id="contenedorPenaltisParados">
                    <label for="inputPenaltisParados">🧤 Penaltis Parados</label>
                    <input type="number" id="inputPenaltisParados" value="0" min="0">
                </div>
            </div>

            <div class="modal-actions">
                <button type="button" class="btn-modal-cancelar" onclick="cerrarModal()">Cancelar</button>
                <button type="button" class="btn-modal-guardar" onclick="guardarDatosJugador()">Guardar Ficha</button>
            </div>
        </div>
    </div>

    <nav th:replace="~{fragments/footer :: footer}"></nav>

</body>
</html>
