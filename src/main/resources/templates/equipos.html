<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="|Información de ${nombreEquipo}|">La Curva League - Evolución</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
    <link rel="stylesheet" th:href="@{/css/estilos-tops.css}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script th:src="@{/js/colorutils.js}"></script>
    <script th:src="@{/js/burbuja-equipos.js}" defer></script>
    <link rel="shortcut icon" th:href="@{/favicon.png}" type="image/x-icon">
</head>
<body>
    <nav class="navbar" th:replace="~{fragments/navbar :: nav}"></nav>
    
    <div class="main-container-equipos">
        <div class="bloque-escudo-nombre">
            <img th:src="${imgEquipo}" alt="Escudo">
            <h1 class="h1-equipo" th:text="${nombreEquipo}">Mister</h1>
        </div>
        <div class="fila-controles">
            <div class="contenedor-termometro equipos">
                <div class="info-termometro">
                    <span>Nivel de llantos:</span>
                    <strong th:text="${etiqueta}"></strong>
                </div>
                <div class="barra-exterior">
                    <div class="barra-interior" 
                        th:classappend="${etiqueta == 'ALTO'} ? 'pulso-critico' : ''"
                        th:style="'width: ' + ${porcentaje} + '%'">
                    </div>
                </div>
            </div>
            <div class="app-navigator equipos">
                <button id="btnPrev" class="nav-btn" onclick="cambiarRango(-1)" style="visibility: hidden;">❮</button>
                <div class="jornada-display" onclick="abrirSelectorRangos()">
                    <span class="j-small" id="labelRango">FILTRAR</span>
                    <span class="j-big" id="textoRangoActual">Todo</span>
                </div>
                <button id="btnSigui" class="nav-btn" onclick="cambiarRango(1)">❯</button>
            </div>           
        </div>

        <div id="modalRangos" class="modal-selector">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>Seleccionar Rango</h3>
                    <button class="close-btn" onclick="cerrarSelector()">✕</button>
                </div>
                <div class="grid-jornadas">
                    <button class="btn-grid" onclick="irARangoDirecto(0)">Todo</button>
                    <th:block th:each="i, iter : ${#numbers.sequence(1, 38, 8)}">
                        <button class="btn-grid" 
                                th:with="fin=${(i + 7 > 38) ? 38 : i + 7}"
                                th:text="|J${i}-J${fin}|"
                                th:onclick="|irARangoDirecto(${iter.index + 1})|">
                        </button>
                    </th:block>
                </div>
            </div>
        </div>
        <div class="split-container">
            <div class="tabla-puntos-equipo-scroll">
                <div class="table-wrapper equipos">
                    <table class="styled-table">
                        <thead>
                            <tr>
                                <th>Jornada</th>
                                <th>Puntos</th>
                                <th>Posición</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="e : ${puntosEquipoJornadas}" 
                                th:id="|jornada-bloque-${e.numeroJornada}|" 
                                class="bloque-jornada">
                                <td th:text="|J${e.numeroJornada}|" style="font-weight: bold; color: #1a237e;"></td> 
                                <td th:text="${e.puntosJornada} + ' pts'"></td>
                                <td th:text="${e.posicionJornada == 1 ? '🏆' : 
                                               e.posicionJornada == 2 ? '🥈' : 
                                               e.posicionJornada == 3 ? '🥉' : 
                                               e.posicionJornada}">
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="chart-column">
                <div class="canvas-wrapper">
                    <canvas id="smoothChart"></canvas>
                </div>
            </div>
        </div>
    </div>

<script th:inline="javascript">
    // --- LÓGICA DEL GRÁFICO ---
    window.myChart = null;
    const ctx = document.getElementById('smoothChart').getContext('2d');
    window.rawData = /*[[${puntosEquipoJornadasGrafica}]]*/ [];
    const labels = rawData.map(d => 'J' + d.numeroJornada);
    const points = rawData.map(d => d.puntosJornada);

    const colorEquipoHex = /*[[${colorEquipo}]]*/ '#6a1b9a';
    const colorConTransparencia = hexaToRGBA(colorEquipoHex, 0.4);
    document.querySelector('.h1-equipo').style.color = colorEquipoHex;

    const gradient = ctx.createLinearGradient(0, 0, 0, 800);
    gradient.addColorStop(0, colorConTransparencia);
    gradient.addColorStop(1, 'rgba(255, 255, 255, 0)');

    window.myChart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: labels,
            datasets: [{
                label: 'Puntos',
                data: points,
                borderColor: colorEquipoHex,
                borderWidth: 4, // Un pelín más grueso para que destaque
                
                // Puntos estilo "App Moderna"
                pointBackgroundColor: '#ffffff', // Fondo blanco
                pointBorderColor: colorEquipoHex, // Borde del color del equipo
                pointBorderWidth: 3,
                pointRadius: 5,
                pointHoverRadius: 7,
                pointHoverBackgroundColor: colorEquipoHex, // Al pasar el ratón se rellena
                pointHoverBorderColor: '#ffffff',
                
                tension: 0.4,
                fill: true,
                backgroundColor: gradient
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                // Dentro de options -> plugins -> tooltip:
                tooltip: {
                    enabled: true,
                    backgroundColor: '#ffffff',
                    titleColor: '#1e293b',
                    bodyColor: '#64748b',
                    padding: 12,
                    cornerRadius: 10,
                    displayColors: false,
                    borderColor: 'rgba(0,0,0,0.1)',
                    borderWidth: 1,
                    bodyFont: { size: 13, weight: '600' },
                    // Esto hace que el tooltip se posicione mejor
                    position: 'nearest',
                    caretSize: 6,
                },
                legend: { display: false }
            },
            // Dentro de options -> scales:
            scales: {
                y: {
                    beginAtZero: true,
                    border: { display: false }, // Quita la línea del eje
                    grid: { 
                        color: 'rgba(0, 0, 0, 0.05)', // Línea muy muy tenue
                        drawTicks: false 
                    },
                    ticks: {
                        color: '#94a3b8', // Gris azulado moderno
                        padding: 10,
                        font: { size: 11 }
                    }
                },
                x: {
                    border: { display: false },
                    grid: { display: false }, // Limpieza total en el eje X
                    ticks: {
                        color: '#94a3b8',
                        padding: 10,
                        font: { size: 11 }
                    }
                }
            }
        }
    });
</script>

<nav th:replace="~{fragments/footer :: footer}"></nav>
</body>
</html>
