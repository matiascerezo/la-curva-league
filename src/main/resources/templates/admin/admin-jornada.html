<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Configurar Alineación de la Jornada</title>
    <!-- Carga del JS externo con defer -->
    <script th:src="@{/js/admin.js}" defer></script>
    
    <!-- Hojas de estilo existentes -->
    <link rel="stylesheet" th:href="@{/css/estilos-jornadas.css}">
    <link rel="stylesheet" th:href="@{/css/estilos-admin.css}">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
    <link rel="stylesheet" th:href="@{/css/estilos-records.css}">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" th:href="@{/favicon.png}" type="image/x-icon">
</head>
<body>

    <!-- Incluir Barra Superior Admin/Navegación -->
    <nav th:replace="~{admin/admin-navbar :: nav}"></nav>

    <div class="pitch-container">
        <h2 style="color: white; text-align: center; margin-top: 0;">
            Alineación - Jornada <span id="jornadaNum" th:text="${jornadaActual ?: 1}">1</span>
        </h2>

        <!-- Selector de Equipo/Míster y Formación Táctica -->
      <div class="tactic-selector-container" style="display: flex; justify-content: center; align-items: center; gap: 1.25rem; flex-wrap: wrap; margin-bottom: 1.25rem; color: white;">
        <div style="display: flex; align-items: center; gap: 0.75rem;">
            <label for="selectEquipo"><strong>Equipo:</strong></label>
            <img id="imgEquipo" class="club-logo-preview empty" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23ccc'><path d='M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5'/></svg>" alt="Logo Club" style="width: 2.5rem; height: 2.5rem; object-fit: contain; border-radius: 50%; background-color: #ffffff; border: 0.0625rem solid #cccccc; padding: 0.125rem;">
            <div>
                <select id="selectEquipo" 
                        th:data-url="@{/mantenimiento/admin/listaEquipos}" 
                        onchange="actualizarLogo('selectEquipo', 'imgEquipo'); cargarAlineacionEquipo();" 
                        style="padding: 0.375rem 0.75rem; border-radius: 0.375rem; border: 0.0625rem solid #ccc; font-weight: bold;">
                    <option value="">Cargando equipos...</option>
                </select>
            </div>
        </div>

            <div>
                <label for="selectEsquema"><strong>Formación Táctica:</strong></label>
                <select id="selectEsquema" onchange="cambiarEsquemaTactico(this.value)" style="padding: 6px 12px; border-radius: 6px; border: 1px solid #ccc; font-weight: bold;">
                    <option value="4-3-3" selected>4-3-3</option>
                    <option value="4-4-2">4-4-2</option>
                    <option value="4-5-1">4-5-1</option>
                    <option value="3-4-3">3-4-3</option>
                    <option value="3-5-2">3-5-2</option>
                    <option value="5-3-2">5-3-2</option>
                    <option value="5-4-1">5-4-1</option>
                </select>
            </div>
        </div>

        <!-- Terreno de Juego -->
        <div id="campoFutbol">
            <div class="pitch-row" id="lineaDEL"></div>
            <div class="pitch-row" id="lineaMED"></div>
            <div class="pitch-row" id="lineaDEF"></div>
            <div class="pitch-row" id="lineaPOR"></div>
        </div>

        <!-- Botón para Alta / Modificación en BBDD -->
        <div style="margin-top: 25px; text-align: center;">
            <button onclick="guardarAlineacion()" style="padding: 12px 30px; font-size: 1rem; font-weight: bold; background: #ffffff; color: #1b5e20; border: none; border-radius: 6px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.2);">
                💾 Guardar / Modificar Alineación
            </button>
        </div>
    </div>

    <!-- Modal de Estadísticas del Jugador -->
    <div class="modal" id="modalJugador">
        <div class="modal-content">
            <h3 id="modalTitulo">Estadísticas del Jugador</h3>
            
            <div class="stat-input">
                <label for="inputNombre">Nombre del Jugador:</label>
                <input type="text" id="inputNombre" placeholder="Ej. Vinicius Jr.">
            </div>

            <!-- Campo destacado de Puntos -->
            <div class="stat-input" style="margin-top: 10px;">
                <label for="inputPuntos" style="color: #2e7d32; font-size: 0.9rem;">💯 Puntos en la Jornada:</label>
                <input type="number" id="inputPuntos" value="0" style="font-weight: bold; font-size: 1.1rem; border: 2px solid #2e7d32;">
            </div>

            <div class="checkbox-group">
                <label class="checkbox-item">
                    <input type="checkbox" id="checkHaJugado" checked> 🏃 Ha Jugado
                </label>
                <label class="checkbox-item">
                    <input type="checkbox" id="checkXiIdeal"> ⭐ XI Ideal
                </label>
            </div>

            <div class="stat-group">
                <div class="stat-input">
                    <label for="inputGoles">⚽ Goles:</label>
                    <input type="number" id="inputGoles" value="0" min="0">
                </div>
                <div class="stat-input">
                    <label for="inputAsistencias">👟 Asistencias:</label>
                    <input type="number" id="inputAsistencias" value="0" min="0">
                </div>
                <div class="stat-input">
                    <label for="inputAmarillas">🟨 Tarjetas Amarillas:</label>
                    <input type="number" id="inputAmarillas" value="0" min="0" max="2">
                </div>
                <div class="stat-input">
                    <label for="inputRojas">🟥 Tarjetas Rojas:</label>
                    <input type="number" id="inputRojas" value="0" min="0" max="1">
                </div>
            </div>

            <div style="display: flex; justify-content: space-between; margin-top: 20px;">
                <button onclick="cerrarModal()" style="padding: 8px 16px;">Cancelar</button>
                <button onclick="guardarDatosJugador()" style="padding: 8px 16px; background: #2e7d32; color: white; border: none; border-radius: 4px;">Guardar Ficha</button>
            </div>
        </div>
    </div>

    <!-- Incluir Footer -->
    <nav th:replace="~{fragments/footer :: footer}"></nav>

</body>
</html>
